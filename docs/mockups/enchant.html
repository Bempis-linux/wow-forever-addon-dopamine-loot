<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enchanting Skill-up</title>
<style>
:root { --panel: rgba(12, 12, 18, 0.93); --text: #e8e2d0; --muted: #9a927e; --gold: #ffd100; }
html, body { margin: 0; height: 100%; background: #0b0b10; color: var(--text); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; }
#panel { position: fixed; top: 10px; left: 10px; width: 310px; max-height: calc(100% - 20px); overflow: auto; z-index: 10;
background: var(--panel); border: 1px solid #3a3426; border-radius: 6px; padding: 10px 12px; box-sizing: border-box; }
#panel h1 { font-size: 14px; margin: 0 0 4px; color: var(--gold); font-weight: 600; }
#panel h2 { font-size: 11px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
small { color: var(--muted); display: block; }
button { background: #2a2418; color: var(--text); border: 1px solid #5a4a28; border-radius: 4px; padding: 4px 8px; cursor: pointer; font: inherit; margin: 2px 2px 0 0; }
button:hover { background: #3a3020; }
button.on { background: #4a3c1c; border-color: #b08a3a; }
label.fx { display: grid; grid-template-columns: 18px 1fr; gap: 1px 4px; padding: 3px 0; cursor: pointer; }
label.fx small { grid-column: 2; }
#fdesc { margin-top: 4px; min-height: 44px; }
#screen { position: fixed; left: 330px; top: 10px; right: 10px; bottom: 10px; border: 1px solid #3a3426; border-radius: 6px; overflow: hidden; }
#screen.dark { background: radial-gradient(ellipse at 40% 70%, #26262e, #121218 60%, #08080b); }
#screen.dirt { background: radial-gradient(ellipse at 40% 70%, #6b5236, #4a3822 55%, #2c2114); }
#screen.grass { background: radial-gradient(ellipse at 40% 70%, #4f7a3a, #2f4f24 60%, #1b2c15); }
#screen.bright { background: radial-gradient(ellipse at 40% 70%, #e6dcc0, #c9bb96 55%, #9c8e6a); }
canvas { position: absolute; inset: 0; }
.char { position: absolute; left: 30%; top: 50%; width: 56px; height: 120px; background: linear-gradient(#6d5a44, #3b2f22); border-radius: 28px 28px 8px 8px; opacity: .9; }
.note { position: absolute; left: 12px; bottom: 10px; right: 12px; color: rgba(255,255,255,.6); font-size: 12px; text-shadow: 0 1px 2px #000; }
#panel { width: 290px; padding: 14px 14px 10px; }
#panel h1 { font-size: 16px; margin: 0 0 2px; }
#panel h2 { margin: 14px 0 6px; }
#panel .sub { margin-bottom: 2px; }
#panel button { padding: 7px 10px; font-size: 13px; border-radius: 6px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button, #moments button { flex: 1 1 auto; margin: 0; }
.toggles { display: flex; gap: 16px; margin-bottom: 6px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.toggles input { width: 18px; height: 18px; accent-color: #b08a3a; }
#moments > div, #xrows > div { flex: 1 1 100%; margin-top: 8px; }
#moments > div small, #xrows > div small { display: block; margin-bottom: 3px; }
#moments > div button, #xrows > div button { margin: 2px 4px 0 0; }
#fdesc { margin-top: 12px; line-height: 1.4; }
#sfRow, #lRow, #hearRow, #lfRow, #lsRow { display: none !important; }
#screen { left: 312px; }
.char { display: none; }
@media (max-width: 760px) {
  #panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 50%; border-radius: 12px 12px 0 0; padding: 12px 14px 16px; }
  #screen { left: 0; right: 0; top: 0; bottom: 50%; border-radius: 0; border: 0; }
  #panel button { padding: 9px 12px; font-size: 14px; }
  .note { display: none; }
}
</style>
</head>
<body>
<div id="panel">
<h1>Enchanting</h1>
<small class="sub">The skill-up module on a broadsword; each finished sword takes the next element (Fire, Lightning, Arcane). Turn Sound on, use the Hear buttons or the moments.</small>
<div class="sec"><h2>Moment</h2><div class="seg" id="moments"><button data-m="up" class="on">Skill-up</button><button data-m="five">Five in a row</button><button data-m="unlock">Reaching the next unlock</button></div></div>
<div class="sec"><h2>Sound &amp; playback</h2><div class="toggles"><label><input type="checkbox" id="snd" checked> Sound</label><label><input type="checkbox" id="loop"> Loop</label></div><div id="xrows"></div></div>
<small id="fdesc"></small>
<div style="display:none"><div id="fams"></div><div id="profs"></div><button data-g="dark" class="on">Dark</button></div>
</div>
<div id="screen" class="dark">
<div class="char"></div>
<canvas id="cv"></canvas>
<div class="note" id="note"></div>
</div>
<script>
'use strict';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), screenEl = document.getElementById('screen');
let W = 0, H = 0; const DPR = window.devicePixelRatio || 1;
function resize() { const r = screenEl.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; }
addEventListener('resize', resize); resize();

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const eOut = t => 1 - Math.pow(1 - t, 3), eBack = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function hex(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mix(a, b, t) { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; }
function grad3(stops, t) { // stops: [[pos, hex]...]
for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) return mix(stops[i - 1][1], stops[i][1], (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
return stops[stops.length - 1][1]; }
function star4(x, y, s, rot = 0) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * .22 : s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); ctx.restore(); }
function text(str, x, y, font, col, align = 'left', o = {}) {
ctx.save(); ctx.font = font; ctx.textAlign = align; ctx.letterSpacing = o.ls || '0px'; if (o.alpha !== undefined) ctx.globalAlpha *= o.alpha;
if (typeof OUTLINE !== 'undefined' && OUTLINE) { ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(0,0,0,.92)'; ctx.strokeText(str, x, y); }
ctx.shadowColor = o.glow || 'rgba(0,0,0,.95)'; ctx.shadowBlur = o.glow ? 10 : 4; ctx.shadowOffsetY = o.glow ? 0 : 1; ctx.fillStyle = col; ctx.fillText(str, x, y);
const w = ctx.measureText(str).width; ctx.restore(); return w; }
function measure(str, font, ls = '0px') { ctx.save(); ctx.font = font; ctx.letterSpacing = ls; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function icon(x, y, s, emo, lit = 1, glow = null) {
ctx.save(); const base = ctx.globalAlpha; if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 12; }
const g = ctx.createRadialGradient(x, y, 0, x, y, s * .7); g.addColorStop(0, '#3a3226'); g.addColorStop(1, '#14100a');
ctx.fillStyle = g; ctx.fillRect(x - s / 2, y - s / 2, s, s); ctx.shadowBlur = 0;
ctx.globalAlpha *= lerp(.35, 1, lit); ctx.font = `${Math.round(s * .66)}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(emo, x, y + 1);
ctx.globalAlpha = base; ctx.strokeStyle = lit > .5 ? '#f0f0f0' : '#6a6a6a'; ctx.lineWidth = 1.5; ctx.strokeRect(x - s / 2 + .75, y - s / 2 + .75, s - 1.5, s - 1.5);
if (lit < 1) { ctx.fillStyle = `rgba(0,0,0,${.5 * (1 - lit)})`; ctx.fillRect(x - s / 2, y - s / 2, s, s); } ctx.restore(); }

let AC = null, OUT = null;
let BOOST = 2; function ac() { if (!AC) { AC = new AudioContext(); OUT = AC.createGain(); OUT.gain.value = 1.6 * BOOST; const C = AC.createDynamicsCompressor(); C.threshold.value = -6; C.knee.value = 12; C.ratio.value = 3; C.attack.value = .01; C.release.value = .25; OUT.connect(C).connect(AC.destination); } return AC; }
setTimeout(() => { const m = [...document.querySelectorAll('button')].find(x => x.textContent.includes('Reaching the next unlock')); if (!m || document.getElementById('boostB')) return; const b = document.createElement('button'); b.id = 'boostB'; const lab = () => b.textContent = 'Phone boost: ' + (BOOST > 1 ? 'on (x2)' : 'off'); lab(); b.onclick = () => { BOOST = BOOST > 1 ? 1 : 2; if (OUT) OUT.gain.value = 1.6 * BOOST; lab(); }; (document.getElementById('xrows') || m.parentNode).appendChild(b); }, 450);
const on = () => document.getElementById('snd').checked;
['pointerdown', 'keydown'].forEach(e => addEventListener(e, () => { if (AC && AC.state !== 'running') AC.resume(); }, true));
function tone(f, t = 0, vol = .06, dec = .4, type = 'sine', f2, att = .004) { if (!on()) return; const A = ac(), T = A.currentTime + t, o = A.createOscillator(), g = A.createGain(); o.type = type; o.frequency.setValueAtTime(f, T); if (f2) o.frequency.exponentialRampToValueAtTime(f2, T + dec * .8); g.gain.setValueAtTime(0, T); g.gain.linearRampToValueAtTime(vol, T + att); g.gain.exponentialRampToValueAtTime(.0001, T + dec); o.connect(g).connect(OUT); o.start(T); o.stop(T + dec + .05); }
function noise(t = 0, dur = .2, vol = .04, f = 1500, q = 1, type = 'bandpass', hit) { if (!on()) return; const A = ac(), T = A.currentTime + t, n = Math.floor(A.sampleRate * dur), buf = A.createBuffer(1, n, A.sampleRate), d = buf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (hit ? Math.exp(-i / n * 6) : Math.sin(Math.PI * i / n)); const s = A.createBufferSource(), fl = A.createBiquadFilter(), g = A.createGain(); s.buffer = buf; fl.type = type; fl.frequency.value = f; fl.Q.value = q; g.gain.value = vol; s.connect(fl).connect(g).connect(OUT); s.start(T); }
function click(t = 0, vol = .05, f = 3000, q = 6) { noise(t, .012, vol, f, q); }
function metal(t, f, vol, dec, parts = [1, 2.76, 5.40, 8.93], amps = [1, .5, .3, .15]) { parts.forEach((p, i) => tone(f * p, t, vol * amps[i], dec / (1 + i * .6), 'sine', null, .002)); }
const semi = n => Math.pow(2, n / 12);

const OL = 'stroke="#1a1410" stroke-width="2.2" stroke-linejoin="round"';
const ART = {
ToolNeedle: `<g transform="translate(26,1) scale(2.75)"><path d="M4 0 L5.4 17 Q4 21.5 2.6 17 Z" fill="#e8e8f0" stroke="#606070" stroke-width=".6"/><ellipse cx="4" cy="4" rx="1" ry="2" fill="#0e130b"/></g>`,
ToolDrop: `<defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0e4ff"/><stop offset=".55" stop-color="#c8a0ff"/><stop offset="1" stop-color="#8a50e0"/></linearGradient></defs>
<g transform="translate(13,3) scale(3.2)"><path d="M6 0 C6 0 11 7 11 10.5 A5 5 0 0 1 1 10.5 C1 7 6 0 6 0 Z" fill="url(#dg)" stroke="#3a1a6a" stroke-width=".7"/><ellipse cx="4.2" cy="10" rx="1.2" ry="1.8" fill="rgba(255,255,255,.6)"/></g>`,
ToolHammer: `<g transform="rotate(-35 32 32)"><rect x="28" y="20" width="9" height="42" rx="3" fill="#a8672e" ${OL}/><line x1="31" y1="26" x2="31" y2="56" stroke="#d8955a" stroke-width="2"/><rect x="10" y="6" width="44" height="17" rx="3" fill="#8a96a4" ${OL}/><rect x="13" y="8" width="38" height="4" rx="2" fill="#c8d2dc"/></g>`,
ToolSprout: `<path d="M32 60 V30" stroke="#2e7a2a" stroke-width="5" stroke-linecap="round"/><path d="M32 34 C18 36 8 26 8 14 C22 12 32 20 32 34 Z" fill="#5ac83a" ${OL}/><path d="M32 30 C44 32 56 24 56 10 C42 8 32 16 32 30 Z" fill="#7ee04a" ${OL}/><path d="M12 16 C20 18 26 24 30 32" fill="none" stroke="#b8f090" stroke-width="2"/><path d="M52 12 C44 14 38 20 34 28" fill="none" stroke="#c8ff9a" stroke-width="2"/>`,
ToolPick: `<g transform="rotate(-30 32 32)"><rect x="28" y="16" width="8" height="46" rx="3" fill="#a8672e" ${OL}/><path d="M4 22 Q32 2 60 22 Q32 12 4 22 Z" fill="#9aa6b2" ${OL}/><rect x="26" y="9" width="12" height="12" rx="2" fill="#6a7684" ${OL}/></g>`,
};
const IMG = {}; for (const k in ART) { const i = new Image(); i.src = 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">${ART[k]}</svg>`); IMG[k] = i; }

let P = [];
function spawn(o) { P.push(Object.assign({ vx: 0, vy: 0, g: 0, age: 0, life: 1, size: 2, shape: 'dot', rot: 0, vr: 0 }, o)); }
function stepP(dt) { for (const p of P) { p.age += dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; } P = P.filter(p => p.age < p.life);
for (const p of P) { const a = 1 - p.age / p.life; ctx.save(); ctx.globalAlpha = a; if (S && S.halo) ctx.filter = HALO; ctx.fillStyle = p.col; ctx.strokeStyle = p.col;
if (p.shape === 'dot') { ctx.shadowColor = p.col; ctx.shadowBlur = 6; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill(); }
else if (p.shape === 'sq') { ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.size, -p.size, p.size * 2, p.size * 2); }
else if (p.shape === 'star') { ctx.shadowColor = p.col; ctx.shadowBlur = 8; star4(p.x, p.y, p.size * (.5 + a * .6), p.rot); }
else if (p.shape === 'ring') { ctx.lineWidth = 2 * a; ctx.beginPath(); ctx.arc(p.x, p.y, p.size + (1 - a) * p.grow, 0, 7); ctx.stroke(); }
else if (p.shape === 'leaf') { ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.ellipse(0, 0, p.size * 1.8, p.size * .8, 0, 0, 7); ctx.fill(); }
ctx.restore(); } }

const PROF = {
Blacksmithing: { col: '#e0883a', light: '#ffc890', tool: 'ToolHammer', motion: 'swing', mat: 'iron', span: [75, 150], cspan: [75, 150], v: 137, five: 140, unlockV: 149,
caps: [[150, 'Expert']], snd: k => { click(0, .05, 2500 * k, 2); metal(0, 1100 * k, .025, .5); },
hit(x, y) { for (let i = 0; i < 10; i++) spawn({ x, y, vx: (Math.random() - .5) * 160, vy: -60 - Math.random() * 90, g: 380, life: .5, size: 1.3, col: i % 2 ? '#ffd070' : '#ff8a30' }); } },
Alchemy: { col: '#9a5ae0', light: '#d0a8ff', tool: 'ToolDrop', motion: 'drip', mat: 'liquid', span: [75, 150], cspan: [75, 150], v: 112, five: 120, unlockV: 149,
caps: [[150, 'Expert']], snd: k => tone(300 * k, 0, .04, .15, 'sine', 180 * k),
hit(x, y) { spawn({ x, y, size: 2, shape: 'ring', grow: 14, life: .5, col: '#d0a8ff' }); for (let i = 0; i < 5; i++) spawn({ x, y, vx: (Math.random() - .5) * 70, vy: -50 - Math.random() * 50, g: 300, life: .5, size: 1.5, col: '#e8d8ff' }); } },
Tailoring: { col: '#c8b88a', light: '#fff4d8', tool: 'ToolNeedle', motion: 'stitch', mat: 'thread', span: [75, 150], cspan: [75, 150], v: 131, five: 131, unlockV: 149,
caps: [[150, 'Expert']], snd: k => noise(0, .05, .02, 5000 * k, 4),
hit(x, y) { for (let i = 0; i < 4; i++) spawn({ x, y, vx: (Math.random() - .5) * 50, vy: -20 - Math.random() * 30, g: 60, life: .6, size: 1, col: '#fff4d8' }); } },
Herbalism: { col: '#3fa83a', light: '#9ff08a', tool: 'ToolSprout', motion: 'pop', mat: 'stem', span: [100, 115], cspan: [75, 150], v: 108, five: 108, unlockV: 114, verb: 'gather',
unlocks: [[85, 'Stranglekelp', '🌾'], [100, 'Bruiseweed', '🌿'], [115, 'Wild Steelbloom', '🌼'], [120, 'Grave Moss', '🍀'], [125, 'Kingsblood', '🌺'], [150, 'Liferoot', '🌱']],
snd: k => { tone(620 * k, 0, .04, .08, 'sine', 980 * k); noise(0, .06, .015, 4000, 1); },
hit(x, y) { for (let i = 0; i < 7; i++) spawn({ x, y, vx: (Math.random() - .5) * 50, vy: -15 - Math.random() * 25, life: 1, size: 1.3, col: '#fff27a' }); } },
Mining: { col: '#c86a2a', light: '#ffb070', tool: 'ToolPick', motion: 'swing', mat: 'stone', span: [75, 125], cspan: [75, 150], v: 101, five: 110, unlockV: 124, verb: 'mine',
unlocks: [[125, 'Iron Ore', '🌑'], [155, 'Gold Ore', '🟡'], [175, 'Mithril Ore', '🔷'], [230, 'Truesilver Ore', '💎']], caps: [[150, 'Expert']], past: [[1, 'Copper Ore', '#c87a3a'], [65, 'Tin Ore', '#b8c0c8'], [75, 'Silver Ore', '#e8ecf0'], [125, 'Iron Ore', '#9a8e86'], [155, 'Gold Ore', '#e8c040'], [175, 'Mithril Ore', '#6ab0d8']],
snd: k => { noise(0, .03, .06, 2400 * k, 3, 'bandpass', true); metal(0, 900 * k, .012, .15, [1, 2.76], [1, .3]); },
hit(x, y) { for (let i = 0; i < 8; i++) spawn({ x, y, vx: (Math.random() - .5) * 140, vy: -50 - Math.random() * 80, g: 420, life: .6, size: 1.5, shape: 'sq', vr: 9, col: i % 3 ? '#8a7e72' : '#ffb070' }); } },
Skinning: { col: '#b07a4a', light: '#f0c890', tool: 'ToolPick', motion: 'swing', mat: 'hide', span: [105, 110], cspan: [75, 150], v: 107, five: 105, unlockV: 109, verb: 'skin',
unlocks: [[110, 'level 22 beasts', '\u{1F43A}'], [115, 'level 23 beasts', '\u{1F417}'], [120, 'level 24 beasts', '\u{1F43B}'], [125, 'level 25 beasts', '\u{1F981}']],
snd: k => { noise(0, .09, .035, 2600 * k, 1.5); noise(.02, .05, .02, 5200 * k, 3); },
hit(x, y) { for (let i = 0; i < 6; i++) spawn({ x, y, vx: (Math.random() - .5) * 60, vy: -20 - Math.random() * 30, g: 120, life: .7, size: 1.3, col: i % 2 ? '#8a5a32' : '#c89a6a' }); } },
Fishing: { col: '#3a8ac8', light: '#9ad8ff', tool: 'ToolDrop', motion: 'drip', mat: 'water', span: [100, 130], cspan: [75, 150], v: 121, five: 118, unlockV: 129, verb: 'fish in',
unlocks: [[130, 'Stranglethorn waters', '\u{1F420}'], [150, 'Arathi waters', '\u{1F421}'], [175, 'Swamp of Sorrows waters', '\u{1F991}'], [205, 'Tanaris waters', '\u{1F988}']],
snd: k => { tone(380 * k, 0, .04, .14, 'sine', 140 * k); noise(0, .06, .02, 1800, 1.2); },
hit(x, y) { spawn({ x, y, size: 2, shape: 'ring', grow: 12, life: .55, col: '#9ad8ff' }); for (let i = 0; i < 4; i++) spawn({ x, y, vx: (Math.random() - .5) * 50, vy: -40 - Math.random() * 30, g: 300, life: .45, size: 1.3, col: '#d8f0ff' }); } },
};
Object.assign(PROF.Skinning, { node: '\u{1F52A}' }); Object.assign(PROF.Fishing, { node: '\u{1F3A3}' });
Object.assign(PROF.Blacksmithing, { made: '\u{1F5E1}️' }); Object.assign(PROF.Alchemy, { made: '\u{1F9EA}' }); Object.assign(PROF.Tailoring, { made: '\u{1F9E5}' }); Object.assign(PROF.Herbalism, { node: '\u{1F33F}' }); Object.assign(PROF.Mining, { node: '⛏️' });
function nextOf(p, v) { // the next thing to reach: { lv, name, emo, cap }
if (p.unlocks) for (const u of p.unlocks) if (u[0] > v) return { lv: u[0], name: u[1], emo: u[2] };
const c = (p.caps || [[150, 'Expert']]).find(c => c[0] >= v) || [150, 'Expert']; return { lv: c[0], name: c[1], emo: '⭐', cap: true }; }

const HIT = .15;
function motion(kind, t) { const u = t < HIT ? t / HIT : 0, r = t >= HIT ? clamp((t - HIT) / .3) : 1;
if (t > HIT + .3 || t < 0) return { dx: 0, dy: 0, rot: 0, sx: 1, sy: 1 };
if (kind === 'swing') return t < HIT ? { dx: 0, dy: -3 * u, rot: -.7 * eOut(u), sx: 1, sy: 1 } : { dx: 0, dy: 0, rot: .25 * (1 - eOut(r)), sx: 1, sy: 1 };
if (kind === 'drip') return t < HIT ? { dx: 0, dy: -9 * eOut(u), rot: 0, sx: 1, sy: 1 } : { dx: 0, dy: 0, rot: 0, sx: 1 + .25 * (1 - r), sy: 1 - .3 * (1 - r) };
if (kind === 'stitch') return t < HIT ? { dx: 0, dy: -8 * eOut(u), rot: 0, sx: 1, sy: 1 } : { dx: 0, dy: 5 * Math.sin(Math.PI * r), rot: 0, sx: 1, sy: 1 };
if (kind === 'pop') { const s = t < HIT ? lerp(1, .6, u) : lerp(.6, 1, eBack(r)); return { dx: 0, dy: 0, rot: 0, sx: s, sy: s }; } }
function drawTool(p, x, y, size, since, fadeAt) { const m = motion(p.motion, since), img = IMG[p.tool]; if (!img.complete) return;
const fa = fadeAt === undefined ? 1 : clamp(1 - (S.age - fadeAt) / .3); if (fa <= 0) return; // (it steps aside for the unlock)
