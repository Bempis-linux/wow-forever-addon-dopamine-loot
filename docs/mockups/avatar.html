<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dopamine Loot avatar options</title>
<style>
  body { margin: 0; padding: 24px; background: #0b0b10; color: #e8e2d0; font: 14px/1.4 system-ui, sans-serif; }
  h1 { color: #ffd100; font-size: 18px; margin: 0 0 4px; }
  p { color: #9a927e; margin: 0 0 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 28px; }
  figure { margin: 0; text-align: center; }
  canvas { width: 260px; height: 260px; border-radius: 8px; display: block; margin-bottom: 8px; }
  .small { display: flex; gap: 10px; justify-content: center; align-items: center; margin: 8px 0; }
  .small canvas { margin: 0; border-radius: 4px; }
  figcaption b { color: #ffd100; }
  figcaption small { display: block; color: #9a927e; max-width: 260px; }
  button { margin-top: 8px; background: #2a2418; color: #e8e2d0; border: 1px solid #5a4a28; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
</style>
</head>
<body>
<h1>CurseForge avatar: pick one</h1>
<p>400×400, original art (no Blizzard images, as CurseForge requires). Small copies show how each reads in search results.</p>
<div class="row" id="row"></div>
<script>
"use strict";
const S = 400;
const QC = { green: "#1eff00", blue: "#0070dd", purple: "#a335ee", orange: "#ff8000" };

function bg(ctx, inner, outer) {
  const g = ctx.createRadialGradient(S / 2, S * 0.55, 20, S / 2, S / 2, S * 0.72);
  g.addColorStop(0, inner); g.addColorStop(1, outer);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);
}
function star(ctx, x, y, r, a = 1, color = "255,244,200") { // a four-point glint
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = `rgba(${color},${a})`;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4, rr = i % 2 ? r * 0.16 : r; ctx.lineTo(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  ctx.closePath(); ctx.fill();
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 0.5);
  g.addColorStop(0, `rgba(${color},${0.9 * a})`); g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function coin(ctx, x, y, r, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  g.addColorStop(0, "#fff3b0"); g.addColorStop(0.45, "#f4c542"); g.addColorStop(1, "#a8740f");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#7a520a"; ctx.lineWidth = r * 0.09; ctx.stroke();
  ctx.strokeStyle = "rgba(122,82,10,0.6)"; ctx.lineWidth = r * 0.05;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.6)"; ctx.lineWidth = r * 0.07; // a highlight on the rim
  ctx.beginPath(); ctx.arc(0, 0, r * 0.86, Math.PI * 1.1, Math.PI * 1.55); ctx.stroke();
  ctx.restore();
}
function gem(ctx, x, y, w, color, rot = 0) { // an item: a dark tile in a quality border, a cut gem inside
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = color; ctx.shadowBlur = w * 0.45;
  ctx.fillStyle = "#000"; ctx.fillRect(-w / 2, -w / 2, w, w);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#1b1712"; ctx.fillRect(-w / 2 + 2, -w / 2 + 2, w - 4, w - 4);
  ctx.strokeStyle = color; ctx.lineWidth = Math.max(2, w * 0.07); ctx.strokeRect(-w / 2 + w * 0.06, -w / 2 + w * 0.06, w * 0.88, w * 0.88);
  const d = w * 0.3; // the gem: a diamond with a light upper facet
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, -d); ctx.lineTo(d, 0); ctx.lineTo(0, d); ctx.lineTo(-d, 0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.moveTo(0, -d); ctx.lineTo(d, 0); ctx.lineTo(0, 0); ctx.lineTo(-d, 0); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function beam(ctx, x, color, h = S, w = 70) {
  const g = ctx.createLinearGradient(0, S, 0, S - h);
  g.addColorStop(0, color + "cc"); g.addColorStop(1, color + "00");
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = g;
  ctx.fillRect(x - w / 2, S - h, w, h); ctx.fillRect(x - w / 6, S - h * 1.1, w / 3, h * 1.1);
  ctx.restore();
}
function ground(ctx, y) {
  const g = ctx.createLinearGradient(40, 0, S - 40, 0);
  g.addColorStop(0, "rgba(255,215,130,0)"); g.addColorStop(0.5, "rgba(255,215,130,0.85)"); g.addColorStop(1, "rgba(255,215,130,0)");
  ctx.fillStyle = g; ctx.fillRect(40, y - 1.5, S - 80, 3);
  const gl = ctx.createRadialGradient(S / 2, y, 0, S / 2, y, 150);
  gl.addColorStop(0, "rgba(255,200,110,0.25)"); gl.addColorStop(1, "rgba(255,200,110,0)");
  ctx.save(); ctx.translate(S / 2, y); ctx.scale(1, 0.35); ctx.translate(-S / 2, -y);
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(S / 2, y, 150, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

const DESIGNS = [
  { name: "A. The rain", tip: "A fountain of loot and coins from a glowing ground line, an Epic in a beam on top. The whole addon in one picture.",
    draw(ctx) {
      bg(ctx, "#3a2350", "#0e0a16");
      beam(ctx, 200, QC.purple, 380, 80);
      ground(ctx, 340);
      const arcs = [[95, 250, -0.4, QC.green], [305, 245, 0.35, QC.blue], [140, 170, -0.2, QC.blue], [262, 175, 0.25, QC.green]];
      for (const [x, y, r, c] of arcs) gem(ctx, x, y, 52, c, r);
      coin(ctx, 70, 160, 20, 0.3); coin(ctx, 330, 150, 18); coin(ctx, 115, 300, 22); coin(ctx, 290, 305, 20); coin(ctx, 200, 312, 24);
      gem(ctx, 200, 128, 96, QC.purple, 0);
      star(ctx, 238, 86, 34); star(ctx, 205, 312, 18); star(ctx, 70, 160, 14, 0.9); star(ctx, 330, 150, 12, 0.8, "235,240,255");
    } },
  { name: "B. The coin", tip: "One big gold coin with a glint, rising out of the light. Simple and bold; reads well when small.",
    draw(ctx) {
      bg(ctx, "#43305e", "#100b19");
      ground(ctx, 330);
      const r = ctx.createRadialGradient(200, 190, 40, 200, 190, 190); // a halo behind the coin
      r.addColorStop(0, "rgba(255,215,120,0.5)"); r.addColorStop(1, "rgba(255,215,120,0)");
      ctx.fillStyle = r; ctx.fillRect(0, 0, S, S);
      coin(ctx, 200, 190, 112);
      star(ctx, 262, 118, 70); star(ctx, 112, 268, 26, 0.85); star(ctx, 320, 250, 18, 0.7, "235,240,255");
      for (const [x, y, c] of [[70, 330, QC.green], [330, 330, QC.blue]]) gem(ctx, x, y, 38, c);
    } },
  { name: "C. The drop", tip: "A Legendary item tile mid-arrival: shockwave rings, sparks and a beam. Ties to the popups.",
    draw(ctx) {
      bg(ctx, "#4a2a12", "#120a06");
      beam(ctx, 200, QC.orange, 400, 120);
      ctx.save(); ctx.globalCompositeOperation = "lighter";
      for (const [rad, a] of [[150, 0.35], [118, 0.55]]) { // two shockwave rings
        ctx.strokeStyle = `rgba(255,170,60,${a})`; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.ellipse(200, 205, rad, rad * 0.95, 0, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
      for (let i = 0; i < 14; i++) { // sparks flying out
        const ang = i / 14 * Math.PI * 2 + 0.2, d = 95 + (i % 3) * 22;
        star(ctx, 200 + Math.cos(ang) * d, 205 + Math.sin(ang) * d, 10 + (i % 4) * 4, 0.9, "255,200,120");
      }
      gem(ctx, 200, 205, 132, QC.orange, -0.08);
      star(ctx, 250, 150, 46);
    } },
];

const row = document.getElementById("row");
for (const d of DESIGNS) {
  const fig = document.createElement("figure");
  const cv = document.createElement("canvas"); cv.width = S; cv.height = S;
  d.draw(cv.getContext("2d"));
  const small = document.createElement("div"); small.className = "small";
  for (const px of [64, 32]) { const c = document.createElement("canvas"); c.width = c.height = px; c.style.width = c.style.height = px + "px"; c.getContext("2d").drawImage(cv, 0, 0, px, px); small.appendChild(c); }
  const cap = document.createElement("figcaption");
  cap.innerHTML = `<b>${d.name}</b><small>${d.tip}</small>`;
  const btn = document.createElement("button"); btn.textContent = "Download PNG (400×400)";
  btn.onclick = () => { const a = document.createElement("a"); a.href = cv.toDataURL("image/png"); a.download = "dopamine-loot-avatar-" + d.name[0].toLowerCase() + ".png"; a.click(); };
  fig.append(cv, small, cap, btn); row.appendChild(fig);
}
</script>
</body>
</html>
